<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Дробей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Калькулятор дробей</h1>
            <p>от Ramondrole</p>
        </div>

        <div class="calculator">
            <div class="input-group">
                <div class="fraction-input">
                    <input type="text" id="num1" placeholder="Числитель">
                    <div class="fraction-line"></div>
                    <input type="text" id="den1" placeholder="Знаменатель">
                </div>

                <div class="operator-select">
                    <button class="operator-btn" data-op="+">+</button>
                    <button class="operator-btn" data-op="-">-</button>
                    <button class="operator-btn" data-op="*">×</button>
                    <button class="operator-btn" data-op="/">÷</button>
                </div>

                <div class="fraction-input">
                    <input type="text" id="num2" placeholder="Числитель">
                    <div class="fraction-line"></div>
                    <input type="text" id="den2" placeholder="Знаменатель">
                </div>
            </div>

            <button class="calculate-btn">ВЫЧИСЛИТЬ</button>

            <div class="result" id="result">
                Результат появится здесь...
            </div>
        </div>

        <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" class="back-btn">Назад</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
